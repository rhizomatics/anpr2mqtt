name: Publish Python 🐍 distribution 📦 to PyPI and TestPyPI

on:
  push:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: Package index to publish to (bypasses the test gate)
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

jobs:
  test:
    # Releases must pass tests before publishing; manual runs skip the gate
    if: github.event_name == 'release'
    uses: ./.github/workflows/test.yml

  build:
    name: Build distribution 📦
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
      with:
        python-version: 3.14
    - name: Install dependencies
      run: uv sync --locked --all-extras --dev
    - name: Build a binary wheel and a source tarball
      run: uv build
    - name: Store the distribution packages
      uses: actions/upload-artifact@v7
      with:
        name: python-package-distributions
        path: dist/

  publish-to-pypi:
    name: >-
      Publish Python 🐍 distribution 📦 to PyPI
    # Full releases (not pre-releases) once tests pass, or manual run targeting PyPI
    if: >-
      always() && needs.build.result == 'success' && (
        (github.event_name == 'release' && github.event.release.prerelease == false && needs.test.result == 'success')
        || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi'))
    needs:
    - test
    - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/anpr2mqtt
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v8
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33

  publish-to-testpypi:
    name: Publish Python 🐍 distribution 📦 to TestPyPI
    # Pre-releases once tests pass, or manual run targeting TestPyPI
    if: >-
      always() && needs.build.result == 'success' && (
        (github.event_name == 'release' && github.event.release.prerelease == true && needs.test.result == 'success')
        || (github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'))
    needs:
    - test
    - build
    runs-on: ubuntu-latest

    environment:
      name: testpypi
      url: https://test.pypi.org/p/anpr2mqtt

    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v8
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish distribution 📦 to TestPyPI
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
      with:
        repository-url: https://test.pypi.org/legacy/
        skip-existing: true