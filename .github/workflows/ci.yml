# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml

  # Single stable check to mark as required in branch protection, so the
  # Python version matrix can change without editing the protection rules.
  ci-ok:
    if: always()
    needs: test
    runs-on: ubuntu-latest
    permissions: {}
    steps:
    - name: Check all CI jobs passed
      env:
        RESULTS: ${{ join(needs.*.result, ' ') }}
      run: |
        echo "Job results: $RESULTS"
        for r in $RESULTS; do
          if [ "$r" != "success" ]; then
            echo "::error::CI failed ($r)"
            exit 1
          fi
        done

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7
    - name: Create Orphan Branch
      uses: action-badges/create-orphan-branch@ad8308a8dded1b6a359b067044b6d2b9bc81d810
      with:
        branch-name: badges
    - name: Install uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
    - name: "Set up Python"
      uses: actions/setup-python@v7
      with:
        python-version-file: "pyproject.toml"
    - name: Install dependencies
      run: uv sync --locked --all-extras --dev
    - name: Fetch test results
      uses: actions/download-artifact@v8
      with:
        name: test-results
    - name: Build a binary wheel and a source tarball
      run: uv build
    - name: Generate badges
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        uv run genbadge coverage -i cov.xml -o badges/coverage.svg
        uv run genbadge tests -i junit/test-results.xml -o badges/tests.svg

        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        TEMP_DIR=$(mktemp -d)
        cd $TEMP_DIR
        git clone --single-branch --branch badges https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git . 2>/dev/null
        cp -r ${{ github.workspace }}/badges .
        git add badges
        if git commit -m "Update badges [skip ci]"; then
          git push origin badges --force
          echo "Badges updated successfully"
        else
          echo "No changes to badges"
        fi

    - name: Install docs system packages
      run: sudo apt-get install -y pngquant

    - name: Deploy docs
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        uv run --group docs properdocs gh-deploy --force --clean



