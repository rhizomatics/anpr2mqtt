# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Nothing by default; each job grants only what it needs (OpenSSF Scorecard Token-Permissions).
permissions: {}

jobs:
  test:
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml

  # Single stable check to mark as required in branch protection, so the
  # Python version matrix can change without editing the protection rules.
  ci-ok:
    if: always()
    needs: test
    runs-on: ubuntu-latest
    permissions: {}
    steps:
    - name: Check all CI jobs passed
      env:
        RESULTS: ${{ join(needs.*.result, ' ') }}
      run: |
        echo "Job results: $RESULTS"
        for r in $RESULTS; do
          if [ "$r" != "success" ]; then
            echo "::error::CI failed ($r)"
            exit 1
          fi
        done

  # Badges and docs, from main only - never from a pull request. The only job here that can write, and the token
  # is given to just the two steps that push, never left in the checkout.
  build:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: docs-deploy-main
      cancel-in-progress: false
    permissions:
      # to push the badges branch and the gh-pages branch the docs are served from
      contents: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
    - name: "Set up Python"
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version-file: "pyproject.toml"
    - name: Install dependencies
      run: |
        uv sync --locked --all-extras --dev
        sudo apt-get install -y pngquant
    - name: Fetch test results
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: test-results

    - name: Generate badges
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        uv run genbadge coverage -i cov.xml -o badges/coverage.svg
        uv run genbadge tests -i junit/test-results.xml -o badges/tests.svg

        TEMP_DIR=$(mktemp -d)
        cd "$TEMP_DIR"
        REMOTE_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
        if ! git clone --single-branch --branch badges "$REMOTE_URL" . 2>/dev/null; then
          # First run: the badges branch doesn't exist on the remote yet.
          git init
          git remote add origin "$REMOTE_URL"
          git checkout --orphan badges
        fi
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        cp -r "$GITHUB_WORKSPACE/badges" .
        git add badges
        if git commit -m "Update badges [skip ci]"; then
          git push origin badges --force
          echo "Badges updated successfully"
        else
          echo "No changes to badges"
        fi
        rm -rf "$TEMP_DIR"

    - name: Deploy docs
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        # The token as actions/checkout would give it, but in this step's environment only, not .git/config
        export GIT_CONFIG_COUNT=1
        export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
        GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
        export GIT_CONFIG_VALUE_0
        uv run --group docs properdocs gh-deploy --force --clean
