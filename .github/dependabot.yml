# Dependency updates. Shape shared across rhizomatics repos: see templates/README.md in rhizomatics/.github.
# Version updates run on the 1st and 15th; security updates are raised as soon as an alert opens.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: "0 6 1,15 * *"
    cooldown:
      default-days: 7
    groups:
      # Trusted: auto-merged by admin-dependabot-automerge.yml once checks pass.
      astral:
        patterns: ["astral-sh/*"]
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    versioning-strategy: increase-if-necessary
    schedule:
      interval: cron
      cronjob: "0 6 1,15 * *"
    cooldown:
      default-days: 7
    groups:
      # Trusted: auto-merged by admin-dependabot-automerge.yml once checks pass.
      astral:
        patterns: ["uv", "ruff", "ty"]
      uv:
        patterns: ["*"]
        update-types: [minor, patch]
      uv-security:
        applies-to: security-updates
        patterns: ["*"]

  # Base images are pinned by digest, so this also raises a PR whenever python:3.14-slim is
  # republished with security fixes. Weekly, not fortnightly, since those land between releases.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      docker:
        patterns: ["*"]
        update-types: [minor, patch]
      docker-security:
        applies-to: security-updates
        patterns: ["*"]
