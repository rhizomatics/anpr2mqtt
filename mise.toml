[settings]
# Cooldown for tool upgrades (policies/project_standards.md in rhizomatics/hq)
minimum_release_age = "7d"

[tools]
prek = "latest"
ruff = { version = "latest", minimum_release_age = "2d" }
ty = { version = "latest", minimum_release_age = "2d" }
uv = { version = "latest", minimum_release_age = "2d" }

[env]
# Homebrew's cairo lives outside the default dylib search path on macOS,
# so cairosvg (used by mkdocs-material for image optimization) can't find it otherwise.
DYLD_FALLBACK_LIBRARY_PATH = "{% if os() == 'macos' %}/opt/homebrew/opt/cairo/lib{% endif %}"
